# .github/workflows/autofix.yml
name: Auto-fix Ruff
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v2
      - run: ruff check . --fix
      - run: ruff format .
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix ruff"
